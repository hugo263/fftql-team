server {
    listen 80;
    server_name news.fftql.team;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / { return 301 https://news.fftql.team$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name news.fftql.team;
    ssl_certificate /etc/letsencrypt/live/news.fftql.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.fftql.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/wwwlogs/tql-news.access.log;
    error_log /www/wwwlogs/tql-news.error.log;
    location / {
        proxy_pass http://127.0.0.1:9012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_buffering off;
        client_max_body_size 8m;
    }
}
